const configured=window.FREEZER_CONFIG&&window.FREEZER_CONFIG.supabaseUrl&&!window.FREEZER_CONFIG.supabaseUrl.includes('YOUR_');
async function boot(){
 if(!configured){document.querySelector('.hero p').textContent='V3 setup required • add Supabase keys to config.js';items=JSON.parse(JSON.stringify(seed));initDemoSettings();renderTabs();render();return}
 db=supabase.createClient(FREEZER_CONFIG.supabaseUrl,FREEZER_CONFIG.supabaseAnonKey);
 const {data:{session}}=await db.auth.getSession(); currentUser=session?.user||null;
 if(!currentUser){showLogin();return}
 await loadCloud(); await loadSettings(); subscribe();
}
function showLogin(){
 document.querySelector('.wrap').insertAdjacentHTML('beforeend',`<div class="card" id="loginCard"><div class="item">Household sign in</div><div class="meta">Use the same household account on both phones.</div><input id="email" class="search" placeholder="Email"><input id="password" class="search" type="password" placeholder="Password"><div class="actions"><button onclick="signIn()">Sign in</button><button onclick="signUp()">Create account</button></div></div>`);
 document.getElementById('q').style.display='none'; document.getElementById('tabs').style.display='none'; document.querySelector('.add').style.display='none';document.getElementById('manageBtn').style.display='none';
}
async function signIn(){let {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error)return alert(error.message);location.reload()}
async function signUp(){let {error}=await db.auth.signUp({email:email.value,password:password.value});if(error)return alert(error.message);alert('Account created. If email confirmation is enabled, confirm the email, then sign in.')}
async function loadCloud(){let {data,error}=await db.from('inventory').select('*').order('item');if(error){alert('Inventory could not be loaded: '+error.message);return}items=data||[];renderTabs();render()}
async function saveRow(x,delta,action){let old=x.quantity,newQty=Math.max(0,old+delta);let {error}=await db.from('inventory').update({quantity:newQty,updated_at:new Date().toISOString()}).eq('id',x.id);if(error)return alert(error.message);await db.from('transactions').insert({inventory_id:x.id,item:x.item,freezer:x.freezer,location:x.location,change_amount:newQty-old,quantity_before:old,quantity_after:newQty,action});x.quantity=newQty;render()}
function subscribe(){db.channel('inventory-live').on('postgres_changes',{event:'*',schema:'public',table:'inventory'},()=>loadCloud()).on('postgres_changes',{event:'*',schema:'public',table:'freezers'},()=>loadSettings()).on('postgres_changes',{event:'*',schema:'public',table:'freezer_locations'},()=>loadSettings()).subscribe()}
function renderTabs(){let a=[{id:'All',name:'All'},...freezers];tabs.innerHTML=a.map(x=>`<button class="${x.id===filter?'on':''}" data-tab="${esc(x.id)}">${esc(x.name)}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.tab;renderTabs();render()})}
function render(){let s=q.value.toLowerCase().trim();let a=items.filter(x=>x.quantity>0&&(filter==='All'||x.freezer===freezerName(filter))&&(!s||[x.item,x.category,x.freezer,x.location].join(' ').toLowerCase().includes(s)));let groups={};a.forEach(x=>(groups[x.item]??=[]).push(x));let names=Object.keys(groups).sort((a,b)=>a.localeCompare(b));summary.textContent=`${names.length} items • ${a.length} active locations`;list.innerHTML=names.length?names.map(name=>{let g=groups[name],units=[...new Set(g.map(x=>x.unit))],total=g.reduce((n,x)=>n+Number(x.quantity),0),qty=units.length===1?`${fmt(total)} ${units[0]} total`:`${g.length} active locations`;return `<div class=card><div class=top><div><div class=item>${name}</div><div class=meta>${g[0].category}</div></div><div class=qty>${qty}</div></div>${g.map(x=>`<div style="border-top:1px solid #edf0ee;margin-top:11px;padding-top:10px"><div class=top><div class=meta style="font-size:14px">${x.freezer} • ${x.location||'Location not specified'}</div><div style="font-weight:800;white-space:nowrap">${fmt(Number(x.quantity))} ${x.unit}</div></div><div class=actions><button onclick="chg(${x.id},-1)">− Use 1</button><button onclick="chg(${x.id},1)">＋ Add 1</button></div></div>`).join('')}</div>`}).join(''):'<div class=empty>No matching active inventory.</div>'}
function fmt(n){return Number.isInteger(n)?n:n.toFixed(1)}
async function chg(id,d){let x=items.find(v=>v.id==id);if(configured)await saveRow(x,d,d<0?'use':'add');else{x.quantity=Math.max(0,x.quantity+d);render()}}
q.oninput=render;
form.onsubmit=async e=>{e.preventDefault();if(!settingsReady)return alert('Freezer settings must be loaded first.');let f=new FormData(form),row={item:f.get('item'),quantity:+f.get('quantity'),unit:f.get('unit'),freezer:f.get('freezer'),location:f.get('location'),category:f.get('category')||'Other',notes:'',updated_at:new Date().toISOString()};if(configured){let {data,error}=await db.from('inventory').insert(row).select().single();if(error)return alert(error.message);await db.from('transactions').insert({inventory_id:data.id,item:data.item,freezer:data.freezer,location:data.location,change_amount:data.quantity,quantity_before:0,quantity_after:data.quantity,action:'new item'});await loadCloud()}else{row.id=Math.max(0,...items.map(x=>x.id))+1;items.push(row);render()}form.reset();dlg.close();refreshAddFreezers()};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function freezerName(id){return freezers.find(x=>String(x.id)===String(id))?.name||''}
function initDemoSettings(){let names=[...new Set(items.map(x=>x.freezer))];freezers=names.map((name,i)=>({id:'demo'+i,name,sort_order:i}));locations=[];freezers.forEach(f=>{[...new Set(items.filter(x=>x.freezer===f.name).map(x=>x.location||'Main / unspecified'))].forEach((name,i)=>locations.push({id:'loc'+f.id+i,freezer_id:f.id,name,kind:kindFor(name),sort_order:i}))});settingsReady=true;refreshAddFreezers()}
function kindFor(name){let n=name.toLowerCase();return n.includes('door')?'Door shelf':n.includes('drawer')?'Drawer':n.includes('basket')?'Basket':n.includes('shelf')?'Shelf':'Section'}
async function loadSettings(){if(!configured){initDemoSettings();return}let [a,b]=await Promise.all([db.from('freezers').select('*').order('sort_order'),db.from('freezer_locations').select('*').order('sort_order')]);if(a.error||b.error){settingsReady=false;document.getElementById('manageBtn').disabled=true;alert('Run migration_v3_to_v31.sql in Supabase SQL Editor before using v3.1. '+(a.error?.message||b.error?.message));return}freezers=a.data||[];locations=b.data||[];settingsReady=true;document.getElementById('manageBtn').disabled=false;if(filter!=='All'&&!freezers.some(x=>String(x.id)===String(filter)))filter='All';refreshAddFreezers();renderTabs();render();if(manager.open)renderManager()}
function refreshAddFreezers(){let sel=document.getElementById('addFreezer');let old=sel.value;sel.innerHTML=freezers.map(f=>`<option value="${esc(f.name)}">${esc(f.name)}</option>`).join('');if(freezers.some(f=>f.name===old))sel.value=old;refreshAddLocations()}
function refreshAddLocations(){let f=freezers.find(x=>x.name===document.getElementById('addFreezer').value);let sel=document.getElementById('addLocation');let old=sel.value;let locs=locations.filter(x=>String(x.freezer_id)===String(f?.id));sel.innerHTML=locs.map(l=>`<option value="${esc(l.name)}">${esc(l.name)}</option>`).join('');if(locs.some(l=>l.name===old))sel.value=old}
function openManager(){if(!settingsReady)return alert('Freezer settings are not ready.');renderManager();manager.showModal()}
function renderManager(){managerContent.innerHTML=freezers.map(f=>`<div class="manage-freezer"><h3>${esc(f.name)}</h3><div class="manage-actions"><button data-action="rename-freezer" data-id="${f.id}">✎ Rename</button><button data-action="delete-freezer" data-id="${f.id}">Remove freezer</button></div><strong>Locations</strong>${locations.filter(l=>String(l.freezer_id)===String(f.id)).map(l=>`<div class="manage-location"><span>${esc(l.name)} <small>(${esc(l.kind)})</small></span><span><button data-action="rename-location" data-id="${l.id}">✎</button> <button data-action="delete-location" data-id="${l.id}">✕</button></span></div>`).join('')}<div class="manage-actions"><button data-action="add-location" data-id="${f.id}">＋ Add location</button></div></div>`).join('');managerContent.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>manageAction(b.dataset.action,b.dataset.id))}
async function saveSettings(table,action,payload,match){if(!configured){return true}let query=db.from(table);let r=action==='insert'?await query.insert(payload):action==='update'?await query.update(payload).eq('id',match):await query.delete().eq('id',match);if(r.error){alert('Unable to save: '+r.error.message);return false}return true}
async function manageAction(action,id){let f=freezers.find(x=>String(x.id)===String(id)),l=locations.find(x=>String(x.id)===String(id));if(action==='rename-freezer'&&f){let name=prompt('New freezer name:',f.name)?.trim();if(!name||name===f.name)return;if(freezers.some(x=>x.name.toLowerCase()===name.toLowerCase()))return alert('That freezer name already exists.');if(!await saveSettings('freezers','update',{name},id))return;let old=f.name;f.name=name;items.filter(x=>x.freezer===old).forEach(x=>x.freezer=name);if(configured){let r=await db.from('inventory').update({freezer:name}).eq('freezer',old);if(r.error)alert('Inventory rename failed: '+r.error.message);await db.from('transactions').update({freezer:name}).eq('freezer',old)}finishSettings();return}
if(action==='delete-freezer'&&f){if(items.some(x=>x.freezer===f.name))return alert('This freezer has inventory records. Move or remove all inventory records first, including zero-quantity entries.');if(!confirm('Remove '+f.name+' and its locations?'))return;if(!await saveSettings('freezers','delete',null,id))return;freezers=freezers.filter(x=>x!==f);locations=locations.filter(x=>String(x.freezer_id)!==String(id));finishSettings();return}
if(action==='add-location'&&f){let name=prompt('Location name (e.g. Door Shelf 2):')?.trim();if(!name)return;if(locations.some(x=>String(x.freezer_id)===String(id)&&x.name.toLowerCase()===name.toLowerCase()))return alert('Location already exists.');let kind=prompt('Type: Shelf, Drawer, Door shelf, Basket, or Section',kindFor(name))?.trim()||'Section';let obj={freezer_id:f.id,name,kind,sort_order:locations.filter(x=>String(x.freezer_id)===String(id)).length};if(configured){let {data,error}=await db.from('freezer_locations').insert(obj).select().single();if(error)return alert(error.message);locations.push(data)}else locations.push({...obj,id:'demo-loc-'+Date.now()});finishSettings();return}
if(action==='rename-location'&&l){let name=prompt('New location name:',l.name)?.trim();if(!name||name===l.name)return;if(locations.some(x=>String(x.freezer_id)===String(l.freezer_id)&&x!==l&&x.name.toLowerCase()===name.toLowerCase()))return alert('Location already exists.');let freezer=freezerName(l.freezer_id),old=l.name;if(!await saveSettings('freezer_locations','update',{name},id))return;l.name=name;items.filter(x=>x.freezer===freezer&&x.location===old).forEach(x=>x.location=name);if(configured){let r=await db.from('inventory').update({location:name}).eq('freezer',freezer).eq('location',old);if(r.error)alert('Inventory location rename failed: '+r.error.message);await db.from('transactions').update({location:name}).eq('freezer',freezer).eq('location',old)}finishSettings();return}
if(action==='delete-location'&&l){let freezer=freezerName(l.freezer_id);if(items.some(x=>x.freezer===freezer&&x.location===l.name))return alert('Inventory records use this location. Reassign them before deleting it.');if(!confirm('Remove location '+l.name+'?'))return;if(!await saveSettings('freezer_locations','delete',null,id))return;locations=locations.filter(x=>x!==l);finishSettings()}}
async function addFreezer(){let name=prompt('Name for new freezer:')?.trim();if(!name)return;if(freezers.some(x=>x.name.toLowerCase()===name.toLowerCase()))return alert('Freezer name already exists.');let obj={name,sort_order:freezers.length};if(configured){let {data,error}=await db.from('freezers').insert(obj).select().single();if(error)return alert(error.message);freezers.push(data)}else freezers.push({...obj,id:'demo-'+Date.now()});finishSettings()}
function finishSettings(){refreshAddFreezers();renderTabs();render();renderManager()}

boot();
</script></body></html>
